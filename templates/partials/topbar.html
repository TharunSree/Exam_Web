{% load static i18n %}

<header class="">
    <div class="topbar">
        <div class="container-fluid">
            <div class="navbar-header">
                <div class="d-flex align-items-center gap-2">
                    <div class="topbar-item">
                        <button type="button" class="button-toggle-menu topbar-button">
                            <i class="ri-menu-2-line fs-24"></i>
                        </button>
                    </div>

                    <form class="app-search d-none d-md-block me-auto">
                        <div class="position-relative">
                            <input type="search" class="form-control border-0" placeholder="Search..."
                                   autocomplete="off" value="">
                            <i class="ri-search-line search-widget-icon"></i>
                        </div>
                    </form>
                </div>

                <div class="d-flex align-items-center gap-1">
                    <div class="topbar-item">
                        <button type="button" class="topbar-button" id="light-dark-mode">
                            <i class="ri-moon-line fs-24 light-mode"></i>
                            <i class="ri-sun-line fs-24 dark-mode"></i>
                        </button>
                    </div>

                    <div class="topbar-item d-none d-md-flex">
                        <button type="button" class="topbar-button" data-bs-toggle="offcanvas"
                                data-bs-target="#notification-offcanvas" aria-controls="notification-offcanvas">
                            <i class="ri-notification-3-line fs-24"></i>
                        </button>
                    </div>

                    <div class="topbar-item">
                        <div class="dropdown">
                            <button type="button" class="topbar-button" id="profile-dropdown" data-bs-toggle="dropdown"
                                    aria-haspopup="true" aria-expanded="false">
                                   <span class="d-flex align-items-center">

                              <span class="d-flex align-items-center">
                                   <img class="rounded-circle" width="32"
                                        src="{% static '/images/users/avatar-1.jpg' %}" alt="avatar-3">
                              </span>

                                        <span class="text-start d-none d-xl-block ms-2">
                                             <span class="d-block fw-semibold">{{ user.username }}</span>
                                             <span class="d-block fs-13 text-muted">User</span>
                                        </span>
                                   </span>
                            </button>
                            <div class="dropdown-menu dropdown-menu-end" aria-labelledby="profile-dropdown">
                                <h6 class="dropdown-header">Welcome {{ user.username }}!</h6>
                                <div class="dropdown-divider"></div>

                                <a class="dropdown-item" href="#">
                                    <iconify-icon icon="solar:user-circle-broken"
                                                  class="align-middle me-2 fs-18"></iconify-icon>
                                    <span class="align-middle">My Profile</span>
                                </a>
                                <a class="dropdown-item" href="#">
                                    <iconify-icon icon="solar:settings-broken"
                                                  class="align-middle me-2 fs-18"></iconify-icon>
                                    <span class="align-middle">Settings</span>
                                </a>

                                <div class="dropdown-divider my-1"></div>

                                <a class="dropdown-item text-danger" href="{% url 'logout' %}">
                                    <iconify-icon icon="solar:logout-3-broken"
                                                  class="align-middle me-2 fs-18"></iconify-icon>
                                    <span class="align-middle">Logout</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

{% include 'partials/right-sidebar.html' %}
